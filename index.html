<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="./assets/logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo</title>
    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>

  <body class="min-h-dvh max-w-md mx-auto bg-base-100">
    <div class="login-page flex flex-col items-center gap-4">
      <div class="logo text-center pt-32">
        <img class="h-20" src="./assets/Logo-full.png" alt="Logo-full" />
      </div>
      <div class="form w-96 p-8">
        <div class="card rounded-2xl bg-base-200 w-full shrink-0 shadow-2xl">
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label text-neutral-900 font-bold"
                >Mobile Number</label
              >
              <input
                id="number"
                type="text"
                maxlength="11"
                minlength="11"
                class="input rounded-full bg-base-300 border-none"
                placeholder="Enter Your Number"
              />
              <label class="label text-neutral-900 font-bold"
                >4 Digit PIN</label
              >
              <input
                id="pin"
                type="password"
                maxlength="4"
                minlength="4"
                class="input rounded-full bg-base-300 border-none"
                placeholder="Enter 4 Digit PIN"
              />
              <button type="button" id="login-btn" class="btn btn-primary rounded-full mt-4">
                Login
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </div>
    <script src="./scripts/login.js"></script>
  </body>
</html>
